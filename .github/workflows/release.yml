name: Release

on:
  push:
    tags:
      - "v*"
  # A tag pushed by the ci.yml auto-tag job (using the default GITHUB_TOKEN)
  # deliberately does NOT fire the `push: tags:` trigger above -- GitHub
  # suppresses workflow-triggered-by-workflow events via the default token to
  # prevent infinite loops. auto-tag explicitly dispatches this workflow via
  # `gh workflow run release.yml --ref <tag>` right after pushing, which is
  # the standard workaround; this trigger is what makes that dispatch valid.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1-alpha)"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with JaCoCo Coverage Check
        run: mvn clean test

      - name: Run Conformance Harness
        run: ./run-conformance

      - name: Confirm tag matches pom.xml version
        run: |
          POM_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pom.xml version $POM_VERSION"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: central-publish
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn clean deploy -Prelease
