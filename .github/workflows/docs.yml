name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pom.xml"
      - "src/main/java/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material ghp-import
      - run: mvn -q -B javadoc:javadoc
      - run: mkdocs build
      - run: cp -r target/reports/apidocs site/javadoc
      - run: ghp-import -n -p -f -m "Deploy docs + javadoc" site
